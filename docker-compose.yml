version: '3.8'

services:
  app:
    build: .
    image: food-vending-app
    ports:
      - '8000:10000'
    environment:
      APP_ENV: 'local'
      APP_DEBUG: 'true'
      APP_KEY: 'base64:REPLACE_ME'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      PORT: '10000'
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - '3306:3306'
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
